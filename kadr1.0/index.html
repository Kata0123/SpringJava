<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кадр — библиотека фильмов и сериалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="top">
  <a class="logo" href="index.html">Кадр</a>
  <nav><a href="#new">Выбор редакции</a><a href="catalog.html">Каталог</a><a href="wheel.html">Колесо удачи</a></nav>
  <div class="auth" id="auth"></div>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-text">
    <h1>Фильмы и сериалы, которые стоит увидеть</h1>
    <p>Ищите по названию, фильтруйте по жанрам и открывайте подробности в один клик.</p>
    <form class="search" id="heroSearch">
      <input id="q" type="search" placeholder="Название фильма или сериала" aria-label="Поиск">
      <button class="btn">Найти</button>
    </form>
  </div>
</section>

<section id="new" class="wrap">
  <h2>Выбор редакции</h2>
  <div class="featured" id="featured"></div>
</section>

<section id="pick" class="wrap">
  <div class="sechead">
    <h2>Подборка на сегодня</h2>
    <div><button class="chip" type="button" id="shuffle">Другая подборка</button> <a class="chip" href="wheel.html">Случайный фильм</a> <a class="chip" href="catalog.html">Весь каталог</a></div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer class="foot">Кадр, все права защищены</footer>
<dialog id="loginModal">
  <form class="login" id="loginForm">
    <button class="x" type="button" id="loginClose" aria-label="Закрыть">×</button>
    <h3>Вход</h3>
    <label>Имя пользователя<input name="name" required autocomplete="username"></label>
    <label>Пароль<input name="pass" type="password" required autocomplete="current-password"></label>
    <button class="btn">Войти</button>
  </form>
</dialog>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/themes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
